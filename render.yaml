services:
  - type: web
    name: pigfarm-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm run build:client
      npm run build:server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false