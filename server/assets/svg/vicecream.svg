<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="50%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#FF1493"/>
    </linearGradient>
    <linearGradient id="iceSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#DB7093"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="30%" stop-color="#F4A460"/>
      <stop offset="70%" stop-color="#DEB887"/>
      <stop offset="100%" stop-color="#D2691E"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DEB887"/>
      <stop offset="50%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
  </defs>
  
  <!-- Ice cream top -->
  <ellipse cx="256" cy="180" rx="130" ry="100" fill="url(#iceTop)"/>
  <ellipse cx="256" cy="180" rx="130" ry="100" fill="url(#iceSide)" opacity="0.3"/>
  
  <!-- Highlight -->
  <ellipse cx="200" cy="140" rx="35" ry="25" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Ice cream cone -->
  <path d="M 180 250 Q 256 380 332 250 Z" fill="url(#coneGrad)"/>
  
  <!-- Cone pattern -->
  <path d="M 195 255 Q 256 360 317 255" stroke="#8B4513" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M 210 260 Q 256 350 302 260" stroke="#8B4513" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M 225 265 Q 256 340 287 265" stroke="#8B4513" stroke-width="2" fill="none" opacity="0.2"/>
  
  <!-- Stick -->
  <rect x="246" y="230" width="20" height="200" rx="5" fill="url(#stickGrad)"/>
  <rect x="246" y="230" width="10" height="200" rx="5" fill="#FFF8DC" opacity="0.3"/>
  
  <!-- Sprinkles -->
  <rect x="220" y="160" width="8" height="3" rx="1" fill="#FF6347" transform="rotate(30 224 161.5)"/>
  <rect x="280" y="150" width="8" height="3" rx="1" fill="#32CD32" transform="rotate(-20 284 151.5)"/>
  <rect x="240" y="130" width="8" height="3" rx="1" fill="#FFD700" transform="rotate(45 244 131.5)"/>
  <rect x="300" y="180" width="8" height="3" rx="1" fill="#00CED1" transform="rotate(-45 304 181.5)"/>
  <rect x="200" y="190" width="8" height="3" rx="1" fill="#FF6347" transform="rotate(15 204 191.5)"/>
  <rect x="260" y="170" width="6" height="2" rx="1" fill="#9370DB" transform="rotate(-30 263 171)"/>
  <rect x="290" y="200" width="6" height="2" rx="1" fill="#32CD32" transform="rotate(60 293 201)"/>
  <rect x="230" y="200" width="6" height="2" rx="1" fill="#FFD700" transform="rotate(-60 233 201)"/>
</svg>